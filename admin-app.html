<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理コンソール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ZIP生成用ライブラリ（ローカル同梱・外部CDNは使わない）。Phase 2-4-8-2 で vendor/jszip に同梱済み -->
<script src="vendor/jszip/jszip.min.js"></script>
<style>
:root{
  --bg:#0F1117;--surface:#1A1D27;--surface2:#232736;--surface3:#2C3148;
  --accent:#4F8EF7;--accent-light:rgba(79,142,247,.15);
  --green:#34D399;--green-bg:rgba(52,211,153,.12);
  --orange:#FB923C;--orange-bg:rgba(251,146,60,.12);
  --red:#F87171;--red-bg:rgba(248,113,113,.12);
  --purple:#A78BFA;--purple-bg:rgba(167,139,250,.12);
  --text:#F1F3F9;--text2:#8B91A8;--text3:#4A5068;
  --border:#2C3148;--radius:10px;--radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

/* ===== SIDEBAR ===== */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border);}
.logo-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-section{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:12px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Noto Sans JP',sans-serif;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:16px;border-top:1px solid var(--border);}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);}
.user-name{font-size:13px;font-weight:500;}
.user-role{font-size:11px;color:var(--text3);}
.logout-btn{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:4px;}
.logout-btn:hover{color:var(--red);}

/* ===== MAIN ===== */
.main{margin-left:240px;flex:1;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.content{padding:28px;}

/* ===== CARDS ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;}
.card-body{padding:20px;}

/* ===== STATS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.stat-val{font-size:26px;font-weight:700;font-family:'DM Mono',monospace;}
.stat-val.blue{color:var(--accent);}
.stat-val.green{color:var(--green);}
.stat-val.orange{color:var(--orange);}
.stat-val.purple{color:var(--purple);}
.stat-sub{font-size:12px;color:var(--text3);margin-top:4px;}

/* ===== TABLE ===== */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{background:var(--surface2);padding:10px 14px;font-size:11px;font-weight:700;color:var(--text3);text-align:left;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border);}
.data-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}
.money{font-family:'DM Mono',monospace;}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-grid>*{min-width:0;}
.invoice-form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
#fi-company-display{max-width:100%;overflow:hidden;box-sizing:border-box;word-break:break-word;}
.form-full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:6px;min-width:0;}
.form-label{font-size:12px;font-weight:500;color:var(--text2);}
.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-family:'Noto Sans JP',monospace;color:var(--text);transition:border-color .15s;width:100%;max-width:100%;min-width:0;box-sizing:border-box;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-input::placeholder{color:var(--text3);}
select.form-input{cursor:pointer;text-overflow:ellipsis;overflow:hidden;}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--accent);color:white;}
.btn-primary:hover{background:#3d7ae8;}
.btn-secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-secondary:hover{color:var(--text);border-color:var(--text3);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.btn-danger:hover{background:var(--red);color:white;}
.btn-success{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.btn-success:hover{background:var(--green);color:white;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ===== BADGES ===== */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.badge-blue{background:var(--accent-light);color:var(--accent);}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-orange{background:var(--orange-bg);color:var(--orange);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-purple{background:var(--purple-bg);color:var(--purple);}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:min(720px,92vw);max-height:85vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px;line-height:1;}
.modal-body{padding:24px;overflow-x:hidden;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

/* ===== TABS ===== */
.page-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;margin-bottom:24px;width:fit-content;}
.page-tab{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);background:none;border:none;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
.page-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3);}

/* ===== LOGIN ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;}
.login-logo{font-size:32px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:28px;}
.login-error{color:var(--red);font-size:13px;margin-top:10px;display:none;}

/* ===== MISC ===== */
.empty{text-align:center;padding:48px;color:var(--text3);font-size:14px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title-lg{font-size:15px;font-weight:700;}
.divider{height:1px;background:var(--border);margin:20px 0;}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--text2);margin:1px;}

/* ===== LOADING ===== */
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;flex-direction:column;gap:12px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* PIN */
.pin-display{display:flex;gap:12px;justify-content:center;margin:20px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .15s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:200px;margin:0 auto;}
.pin-key{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:18px;font-weight:500;font-family:'DM Mono',monospace;cursor:pointer;color:var(--text);transition:all .1s;}
.pin-key:hover{background:var(--surface3);border-color:var(--accent);}
.pin-key:active{transform:scale(.95);}

@media(max-width:560px){
  .form-grid,.form-grid.cols3{grid-template-columns:1fr;}
  .form-full{grid-column:1;}
  .modal-body{padding:16px;}
  .modal-header{padding:16px;}
  .modal-footer{padding:12px 16px;}
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-wrap" id="loadingWrap">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3);">読み込み中...</div>
</div>

<!-- Login -->
<div class="login-wrap" id="loginWrap" style="display:none;">
  <div class="login-card">
    <div class="login-logo">⚙️</div>
    <div class="login-title">管理コンソール</div>
    <div class="login-sub">管理者専用ページです</div>
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">管理者を選択</label>
      <select class="form-input" id="loginName"><option value="">選択してください</option></select>
    </div>
    <div class="form-label" style="margin-bottom:8px;">PINコード</div>
    <div class="pin-display">
      <div class="pin-dot" id="p0"></div><div class="pin-dot" id="p1"></div>
      <div class="pin-dot" id="p2"></div><div class="pin-dot" id="p3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="aPin('1')">1</button>
      <button class="pin-key" onclick="aPin('2')">2</button>
      <button class="pin-key" onclick="aPin('3')">3</button>
      <button class="pin-key" onclick="aPin('4')">4</button>
      <button class="pin-key" onclick="aPin('5')">5</button>
      <button class="pin-key" onclick="aPin('6')">6</button>
      <button class="pin-key" onclick="aPin('7')">7</button>
      <button class="pin-key" onclick="aPin('8')">8</button>
      <button class="pin-key" onclick="aPin('9')">9</button>
      <button class="pin-key" onclick="aPinClear()">C</button>
      <button class="pin-key" onclick="aPin('0')">0</button>
      <button class="pin-key" onclick="aPinBack()">⌫</button>
    </div>
    <div class="login-error" id="loginError">名前またはPINが正しくありません</div>
  </div>
</div>

<!-- App -->
<div id="appWrap" style="display:none;width:100%;">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-title">⚙️ 管理コンソール</div>
      <div class="logo-sub">Admin Console</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">現場管理</div>
      <button class="nav-item active" onclick="showPage('sites')" id="nav-sites"><span class="nav-icon">🏗️</span>現場一覧</button>
      <button class="nav-item" onclick="showPage('machines')" id="nav-machines"><span class="nav-icon">🚜</span>重機管理</button>
      <div class="nav-section">財務</div>
      <button class="nav-item" onclick="showPage('invoices')" id="nav-invoices"><span class="nav-icon">📄</span>請求書</button>
      <button class="nav-item" onclick="showPage('invoicePdf')" id="nav-invoicePdf"><span class="nav-icon">🧾</span>請求書PDF</button>
      <button class="nav-item" onclick="showPage('rates')" id="nav-rates"><span class="nav-icon">💴</span>単価設定</button>
      <button class="nav-item" onclick="showPage('budgets')" id="nav-budgets"><span class="nav-icon">📋</span>実行予算</button>
      <div class="nav-section">集計出力</div>
      <button class="nav-item" onclick="showPage('csv')" id="nav-csv"><span class="nav-icon">📊</span>CSV出力</button>
      <div class="nav-section">人員</div>
      <button class="nav-item" onclick="showPage('employees')" id="nav-employees"><span class="nav-icon">👷</span>従業員</button>
      <button class="nav-item" onclick="showPage('admins')" id="nav-admins"><span class="nav-icon">🔐</span>管理者</button>
      <button class="nav-item" onclick="showPage('leave')" id="nav-leave"><span class="nav-icon">🌴</span>有給管理</button>
      <div class="nav-section">お知らせ</div>
      <button class="nav-item" onclick="showPage('notices')" id="nav-notices"><span class="nav-icon">📢</span>お知らせ管理</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebarAvatar"></div>
        <div><div class="user-name" id="sidebarName"></div><div class="user-role">管理者</div></div>
        <button class="logout-btn" onclick="aLogout()" title="ログアウト">⏻</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div><div class="page-title" id="pageTitle">現場一覧</div><div class="page-sub" id="pageSub"></div></div>
      <div id="topbarActions"></div>
    </div>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
const SB_URL='https://fblecreevjtrqnkhmwuk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibGVjcmVldmp0cnFua2htd3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDIzNTgsImV4cCI6MjA5NTIxODM1OH0.33YzIhtqSpN9yoJ3D7jPfTyvYqPB7ovyjlOdEgNL8kg';
const sb=supabase.createClient(SB_URL,SB_KEY);

let currentUser=null;
let aPin_str='';
let _sites=[],_employees=[],_subcontractors=[],_machines=[],_unitRates={};
let _companies=[];
let _editSiteId=null,_editInvId=null,_editBudgetId=null,_editEmpId=null,_editAdminId=null,_editMachineId=null;
let _invoiceTab='active';
let _budgetTab='active';

function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmt(n){return '¥'+(n||0).toLocaleString();}
function escapeHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function companyOptions(selectedId){
  const blank='<option value="">未設定</option>';
  return blank+_companies.map(c=>`<option value="${c.id}"${c.id===selectedId?' selected':''}>${escapeHtml(c.name)}</option>`).join('');
}
function companyName(id){
  if(!id)return '未設定';
  const c=_companies.find(c=>c.id===id);
  return c?escapeHtml(c.name):'未設定';
}

// ===== AUTH =====
async function init(){
  const saved=sessionStorage.getItem('adminUser');
  if(saved){currentUser=JSON.parse(saved);await startApp();return;}
  const{data}=await sb.from('genka_admins').select('id,name').eq('is_active',true).order('name');
  const sel=document.getElementById('loginName');
  (data||[]).forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name;sel.appendChild(o);});
  document.getElementById('loadingWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
}

function aPin(n){if(aPin_str.length>=4)return;aPin_str+=n;updatePinDots();if(aPin_str.length===4)setTimeout(tryLogin,200);}
function aPinBack(){aPin_str=aPin_str.slice(0,-1);updatePinDots();}
function aPinClear(){aPin_str='';updatePinDots();}
function updatePinDots(){for(let i=0;i<4;i++)document.getElementById('p'+i).classList.toggle('filled',i<aPin_str.length);}

async function tryLogin(){
  const id=document.getElementById('loginName').value;
  if(!id){document.getElementById('loginError').style.display='block';aPin_str='';updatePinDots();return;}
  const{data:user,error}=await sb.rpc('create_admin_session',{admin_id_input:id,pin_input:aPin_str}).maybeSingle();
  if(error){document.getElementById('loginError').style.display='block';aPin_str='';updatePinDots();return;}
  if(user){
    currentUser=user;sessionStorage.setItem('adminUser',JSON.stringify(user));
    document.getElementById('loginError').style.display='none';
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('loadingWrap').style.display='flex';
    await startApp();
  }else{document.getElementById('loginError').style.display='block';aPin_str='';updatePinDots();}
}

async function aLogout(){
  const token=currentUser?.session_token;
  if(token){try{await sb.rpc('revoke_admin_session',{session_token_input:token});}catch(e){}}
  sessionStorage.removeItem('adminUser');location.reload();
}

async function startApp(){
  // Phase 4-D-1b：単価（unit_rates）は secure read RPC 経由（direct SELECT を置換）。
  const token=currentUser?.session_token;
  if(!token){sessionStorage.removeItem('adminUser');location.reload();return;}
  const[sRes,eRes,subRes,urRes,cRes]=await Promise.all([
    sb.from('sites').select('*').eq('is_active',true).order('name'),
    sb.from('employees').select('id,name,role,company_id,is_active').eq('is_active',true).order('name'),
    sb.from('subcontractors').select('*').eq('is_active',true).order('name'),
    sb.rpc('list_unit_rates_secure',{session_token_input:token}),
    sb.rpc('list_companies_secure',{session_token_input:token})
  ]);
  if(urRes.error)console.error('単価取得エラー:',urRes.error);
  if(cRes.error)console.error('会社取得エラー:',cRes.error);
  _sites=sRes.data||[];
  _employees=eRes.data||[];
  _subcontractors=subRes.data||[];
  _companies=cRes.data||[];
  (urRes.data||[]).forEach(r=>{_unitRates[`${r.category}:${r.name}`]=r;});

  document.getElementById('sidebarAvatar').textContent=currentUser.name.slice(0,1);
  document.getElementById('sidebarName').textContent=currentUser.name;
  document.getElementById('loadingWrap').style.display='none';
  document.getElementById('appWrap').style.display='flex';
  showPage('sites');
}

// ===== NAVIGATION =====
async function showPage(name){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+name)?.classList.add('active');
  const titles={sites:'現場一覧',invoices:'請求書',invoicePdf:'請求書PDF',rates:'単価設定',budgets:'実行予算',employees:'従業員',admins:'管理者',machines:'重機管理',leave:'有給管理',notices:'お知らせ管理',csv:'CSV出力'};
  document.getElementById('pageTitle').textContent=titles[name]||'';
  document.getElementById('pageSub').textContent='';
  document.getElementById('topbarActions').innerHTML='';
  const pages={sites:pageSites,invoices:pageInvoices,invoicePdf:pageInvoicePdf,rates:pageRates,budgets:pageBudgets,employees:pageEmployees,admins:pageAdmins,machines:pageMachines,leave:pageLeave,notices:pageNotices,csv:pageCsv};
  if(pages[name]) await pages[name]();
}

// ===== MODAL =====
function openModal(title,body,footer=''){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalFooter').innerHTML=footer;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}

// ===== SITES PAGE =====
async function pageSites(){
  document.getElementById('topbarActions').innerHTML=`<button class="btn btn-primary" onclick="openSiteModal()">＋ 現場を追加</button>`;

  // Supabaseから最新データを取得してキャッシュ更新
  const{data}=await sb.from('sites').select('*,site_assignments(employee_id,is_active)').eq('is_active',true).order('name');
  _sites=(data||[]);

  const html=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">総現場数</div><div class="stat-val blue">${_sites.length}</div></div>
      <div class="stat-card"><div class="stat-label">工期設定済</div><div class="stat-val green">${_sites.filter(s=>s.start_date).length}</div></div>
      <div class="stat-card"><div class="stat-label">住所設定済</div><div class="stat-val orange">${_sites.filter(s=>s.location).length}</div></div>
      <div class="stat-card"><div class="stat-label">配属あり</div><div class="stat-val purple">${_sites.filter(s=>s.site_assignments?.filter(a=>a.is_active).length>0).length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">現場一覧</div></div>
      <table class="data-table">
        <thead><tr><th>現場名</th><th>会社</th><th>住所・工事場所</th><th>工期</th><th>配属人数</th><th>操作</th></tr></thead>
        <tbody>${_sites.map(s=>`
          <tr>
            <td><div style="font-weight:600;">${escapeHtml(s.name)}</div></td>
            <td>${s.company_id?companyName(s.company_id):'<span style="color:var(--orange);">未設定</span>'}</td>
            <td><div style="color:${s.location?'var(--text)':'var(--text3)'};">${escapeHtml(s.location||'未設定')}</div></td>
            <td><div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);">${s.start_date&&s.end_date?s.start_date+' 〜 '+s.end_date:s.start_date?s.start_date+' 〜':'未設定'}</div></td>
            <td><span class="badge badge-blue">${s.site_assignments?.filter(a=>a.is_active).length||0}名</span></td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick="openSiteModal('${s.id}')">編集</button>

        </tbody>

    </div>`;
  document.getElementById('pageContent').innerHTML=html;

async function openSiteModal(siteId=null){
  // 最新データをSupabaseから取得
  let s=null;
  if(siteId){
    const{data}=await sb.from('sites').select('*').eq('id',siteId).single();
    s=data;
  }
  const{data:assigns}=siteId?await sb.from('site_assignments').select('employee_id').eq('site_id',siteId).eq('is_active',true):{data:[]};
  const assignedIds=(assigns||[]).map(a=>a.employee_id);

  const empChecks=_employees.filter(e=>e.role!=='admin').map(e=>`
    <label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;">
      <input type="checkbox" value="${e.id}" ${assignedIds.includes(e.id)?'checked':''} style="width:15px;height:15px;accent-color:var(--accent);">
      <span style="font-size:13px;">${e.name}</span>
    </label>`).join('');

  _editSiteId=siteId||null;
  const body=`
    <div class="form-grid" style="margin-bottom:16px;">
      <div class="form-group form-full">
        <label class="form-label">現場名 *</label>
        <input class="form-input" id="f-name" value="${escapeHtml(s?.name||'')}" placeholder="例：〇〇ビル3F">
      </div>
      <div class="form-group form-full">
        <label class="form-label">住所・工事場所</label>
        <input class="form-input" id="f-location" value="${escapeHtml(s?.location||'')}" placeholder="例：静岡県浜松市中央区〇〇町1-2-3">
      </div>
      <div class="form-group">
        <label class="form-label">工期 開始</label>
        <input type="date" class="form-input" id="f-start" value="${s?.start_date||''}">
      </div>
      <div class="form-group">
        <label class="form-label">工期 終了</label>
        <input type="date" class="form-input" id="f-end" value="${s?.end_date||''}">
      </div>
      <div class="form-group">
        <label class="form-label">管理会社</label>
        <select class="form-input" id="f-company">
          ${companyOptions(s?.company_id)}
        </select>
      </div>
    </div>
    <div style="margin-bottom:12px;">
      <div class="form-label" style="margin-bottom:8px;">従業員の配属</div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;max-height:180px;overflow-y:auto;">
        ${empChecks||'<div style="color:var(--text3);font-size:13px;">従業員がいません</div>'}
      </div>
    </div>`;

  openModal(s?`🏗️ ${s.name} を編集`:'🏗️ 新規現場を追加',body,`
    <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
    <button class="btn btn-primary" onclick="saveSite()">保存</button>`);
}

async function saveSite(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const siteId=_editSiteId;
  const nameEl=document.getElementById('f-name');
  const locEl=document.getElementById('f-location');
  const startEl=document.getElementById('f-start');
  const endEl=document.getElementById('f-end');
  if(!nameEl){alert('エラー：フォーム要素が見つかりません');return;}
  const name=nameEl.value.trim();
  if(!name){alert('現場名を入力してください');return;}
  const company_id=document.getElementById('f-company').value||null;
  const location=locEl?.value.trim()||null;
  const start_date=startEl?.value||null;
  const end_date=endEl?.value||null;
  let id=siteId;
  if(siteId){
    const{error}=await sb.rpc('update_site_secure',{
      session_token_input:token,
      id_input:siteId,
      name_input:name,
      location_input:location,
      start_date_input:start_date,
      end_date_input:end_date,
      company_id_input:company_id
    });
    if(error){alert('保存エラー：'+error.message);return;}
  }else{
    const{data,error}=await sb.rpc('create_site_secure',{
      session_token_input:token,
      name_input:name,
      location_input:location,
      start_date_input:start_date,
      end_date_input:end_date,
      company_id_input:company_id
    });
    if(error){alert('保存エラー：'+error.message);return;}
    id=data?.[0]?.id;
  }
  // 配属更新（失敗しても現場情報の保存済みとして画面更新）
  if(id){
    const checks=document.querySelectorAll('#modalBody input[type=checkbox]');
    const employeeIds=Array.from(checks).filter(c=>c.checked).map(c=>c.value);
    const{error:aErr}=await sb.rpc('replace_site_assignments_secure',{
      session_token_input:token,
      site_id_input:id,
      employee_ids_input:employeeIds
    });
    if(aErr)console.error('配属更新エラー:',aErr.message);
  }
  closeModal();
  await pageSites();
}

async function deleteSite(id){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const s=_sites.find(x=>x.id===id);
  if(!confirm(`「${s?.name||id}」を無効化しますか？\n無効化すると、通常の現場一覧には表示されなくなります。`))return;
  const{error}=await sb.rpc('deactivate_site_secure',{
    session_token_input:token,
    id_input:id
  });
  if(error){alert('無効化に失敗しました：'+error.message);return;}
  await pageSites();
  showPage('sites');
}

            const invComp=i.site_id?(site?.company_id?companyName(site.company_id):'<span style="color:var(--orange);">未設定</span>'):'-';

async function openInvoiceModal(invId=null){
  // Phase 4-D-3b：invoices 詳細は secure read RPC 経由（.single() 廃止）。
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  let inv=null;
  if(invId){
    const{data,error}=await sb.rpc('get_invoice_secure',{session_token_input:token,id_input:invId});
    if(error)console.error('請求書取得エラー:',error);
    inv=data?.[0]||null;
  }
  const siteOpts=_sites.map(s=>`<option value="${s.id}" ${inv?.site_id===s.id?'selected':''}>${s.name}</option>`).join('');
  const cats=[['subcontract','🧱 外注費'],['material','📦 材料費'],['machine_lease','🚜 重機リース'],['other','📋 その他']];
  _editInvId=inv?.id||null;
  const body=`
    <div class="form-grid invoice-form-grid">
      <div class="form-group">
        <label class="form-label">請求日 *</label>
        <input type="date" class="form-input" id="fi-date" value="${inv?.invoice_date||localDate()}">
      </div>
      <div class="form-group">
        <label class="form-label">現場</label>
        <select class="form-input" id="fi-site" onchange="updateInvoiceCompanyDisplay()"><option value="">指定なし</option>${siteOpts}</select>
      </div>
      <div class="form-group">
        <label class="form-label">管理会社</label>
        <div id="fi-company-display" style="padding:9px 12px;font-size:13px;"></div>
      </div>
      <div class="form-group form-full">
        <label class="form-label">業者名・取引先 *</label>
        <input class="form-input" id="fi-vendor" value="${inv?.vendor_name||''}" placeholder="例：岡井重機">
      </div>
      <div class="form-group">
        <label class="form-label">カテゴリ</label>
        <select class="form-input" id="fi-cat">${cats.map(([v,l])=>`<option value="${v}" ${inv?.category===v?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label class="form-label">税</label>
        <select class="form-input" id="fi-tax">
          <option value="true" ${inv?.tax_included!==false?'selected':''}>税込</option>
          <option value="false" ${inv?.tax_included===false?'selected':''}>税抜</option>
        </select>
      </div>

        <label class="form-label">品目・内容</label>
        <input class="form-input" id="fi-desc" value="${inv?.description||''}" placeholder="例：8月分重機回送費">
      </div>
      <div class="form-group">
        <label class="form-label">金額 *</label>
        <input type="number" class="form-input" id="fi-amount" value="${inv?.amount||''}" step="1000" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">メモ</label>
        <input class="form-input" id="fi-memo" value="${inv?.memo||''}" placeholder="任意">
      </div>
    </div>`;
  openModal(inv?'📄 請求書を編集':'📄 請求書を追加',body,`
    <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
    <button class="btn btn-primary" onclick="saveInvoice()">保存</button>`);
  updateInvoiceCompanyDisplay();
}

function updateInvoiceCompanyDisplay(){
  const siteId=document.getElementById('fi-site')?.value;
  const el=document.getElementById('fi-company-display');
  if(!el)return;
  if(!siteId){
    el.innerHTML='<span style="color:var(--text3);font-size:12px;">現場を選択すると会社が自動設定されます</span>';
    return;
  }
  const site=_sites.find(s=>s.id===siteId);
  if(site?.company_id){
    el.innerHTML=`<span class="badge badge-blue">${companyName(site.company_id)}</span>`;
  }else{
    el.innerHTML='<span style="color:var(--orange);font-size:12px;">⚠️ 現場の管理会社が未設定です</span>';
  }
}

async function saveInvoice(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const invId=_editInvId;
  const date=document.getElementById('fi-date').value;
  const vendor=document.getElementById('fi-vendor').value.trim();
  const amountStr=document.getElementById('fi-amount').value;
  const amount=parseInt(amountStr);
  if(!date||!vendor||amountStr===''||isNaN(amount)){alert('日付・業者名・金額は必須です');return;}
  const btn=document.querySelector('#modalFooter .btn-primary');
  if(btn)btn.disabled=true;
  const siteId=document.getElementById('fi-site').value||null;
  const category=document.getElementById('fi-cat').value;
  const taxIncluded=document.getElementById('fi-tax').value==='true';
  const desc=document.getElementById('fi-desc').value||null;
  const memo=document.getElementById('fi-memo').value||null;
  let error;
  if(invId){
    const res=await sb.rpc('update_invoice_secure',{
      session_token_input:token,
      id_input:invId,
      invoice_date_input:date,
      site_id_input:siteId,
      vendor_name_input:vendor,
      category_input:category,
      amount_input:amount,
      tax_included_input:taxIncluded,
      description_input:desc,
      memo_input:memo
    });
    error=res.error;
  }else{
    const res=await sb.rpc('create_invoice_secure',{
      session_token_input:token,
      invoice_date_input:date,
      site_id_input:siteId,
      vendor_name_input:vendor,
      category_input:category,
      amount_input:amount,
      tax_included_input:taxIncluded,
      description_input:desc,
      memo_input:memo
    }).maybeSingle();
    error=res.error;
  }
  if(error){
    if(btn)btn.disabled=false;
    console.error('請求書保存エラー:',error.message);
    alert('保存に失敗しました：'+error.message);
    return;
  }
  closeModal();await pageInvoices();
}

async function deleteInvoice(id){
  if(!confirm('この請求書を取り消しますか？'))return;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const{error}=await sb.rpc('reject_invoice_secure',{session_token_input:token,id_input:id});
  if(error){alert('取り消しに失敗しました：'+error.message);return;}
  await pageInvoices();
}

async function restoreInvoice(id){
  if(!confirm('この請求書を通常一覧に戻しますか？\n戻すと、原価管理にも再度反映されます。'))return;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const{error}=await sb.rpc('restore_invoice_secure',{session_token_input:token,id_input:id});
  if(error){alert('復元に失敗しました：'+error.message);return;}
  await pageInvoices();
}

  editing:{label:'入力中',cls:'badge-blue'},
  amount_mismatch:{label:'差額あり',cls:'badge-orange'},
  confirmed:{label:'確認済み',cls:'badge-green'},
  queued:{label:'候補作成済み',cls:'badge-purple'},

let _invDocId=null,_invDocStatus=null,_invDocLines=[],_invPdfTab='list';

function invDocBadge(status){
  const s=INV_DOC_STATUS[status]||{label:status||'-',style:'background:var(--surface2);color:var(--text3);'};
  return s.cls?`<span class="badge ${s.cls}">${s.label}</span>`:`<span class="badge" style="${s.style}">${s.label}</span>`;
}
function invProjectOptions(selId,selName){
  let opts='<option value="">指定なし</option>';
  let found=false;
  opts+=_sites.map(s=>{const sel=s.id===selId;if(sel)found=true;return `<option value="${s.id}" ${sel?'selected':''}>${escapeHtml(s.name)}</option>`;}).join('');
  if(selId&&!found)opts+=`<option value="${selId}" selected>${escapeHtml(selName||'(無効な工事)')}</option>`;
  return opts;
}
function costCategoryOptions(sel){
  return '<option value="">未選択</option>'+COST_CATEGORIES.map(c=>`<option value="${c}" ${c===sel?'selected':''}>${c}</option>`).join('');
}

async function invPdfSignedUrl(path){
  if(!path)return null;
  const{data,error}=await sb.storage.from('invoice-pdfs').createSignedUrl(path,3600);
  if(error){console.error('署名URL生成エラー:',error.message);return null;}
  return data?.signedUrl||null;
}
async function openInvoicePdf(path){
  const u=await invPdfSignedUrl(path);
  if(u)window.open(u,'_blank');else alert('PDFを開けませんでした');
}

// ---- PDFアップロード ----
async function uploadInvoicePdf(input){
  const file=input.files?.[0];
  if(!file)return;
  // PDF以外はアップロード不可
  if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){
    alert('PDFファイルのみアップロードできます');input.value='';return;
  }
  if(file.size>10*1024*1024){alert('PDFは10MBまでです');input.value='';return;}
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  input.disabled=true;
  document.getElementById('pageContent').innerHTML='<div class="card"><div class="card-body">アップロード中…</div></div>';
  try{
    const now=new Date();
    const yyyy=now.getFullYear();
    const mm=String(now.getMonth()+1).padStart(2,'0');
    const uuid=(crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(16).slice(2)));
    const path=`original/${yyyy}/${mm}/${uuid}.pdf`;
    const{error:upErr}=await sb.storage.from('invoice-pdfs').upload(path,file,{contentType:'application/pdf'});
    if(upErr){alert('アップロードに失敗しました：'+upErr.message);await pageInvoicePdf('list');return;}
    const{data,error}=await sb.rpc('create_invoice_document_secure',{
      session_token_input:token,
      file_path_input:path,
      original_file_name_input:file.name,
      uploaded_by_input:currentUser.name
    });
    if(error){alert('請求書レコードの作成に失敗しました：'+error.message);await pageInvoicePdf('list');return;}
    const newId=Array.isArray(data)?data[0]?.id:data?.id;
    if(newId){await openInvoiceDocDetail(newId);}else{await pageInvoicePdf('list');}
  }catch(e){
    alert('アップロード処理でエラーが発生しました：'+(e?.message||e));
    await pageInvoicePdf('list');
  }
}

  const{data:doc,error}=await sb.rpc('get_invoice_document_secure',{session_token_input:token,id_input:id});

  _invDocId=id;
  _invDocStatus=doc.status;
  _invDocLines=(lines||[]).map(l=>({
    project_id:l.project_id||'',project_name:l.project_name||'',

function renderInvDocLinesTable(){
  const ro=(_invDocStatus==='confirmed'||_invDocStatus==='queued');
  const dis=ro?'disabled':'';
  const body=document.getElementById('invDocLinesBody');
  if(!body)return;
  body.innerHTML=_invDocLines.map((l,i)=>`
    <tr>
      <td><select class="form-input" style="font-size:12px;padding:6px;" onchange="updateInvDocLine(${i},'project_id',this.value)" ${dis}>${invProjectOptions(l.project_id,l.project_name)}</select></td>
      <td><select class="form-input" style="font-size:12px;padding:6px;" onchange="updateInvDocLine(${i},'cost_category',this.value)" ${dis}>${costCategoryOptions(l.cost_category)}</select></td>
      <td><input class="form-input" style="font-size:12px;padding:6px;" value="${escapeHtml(l.description||'')}" oninput="updateInvDocLine(${i},'description',this.value)" placeholder="摘要" ${dis}></td>
      <td><input type="number" class="form-input" style="font-size:12px;padding:6px;text-align:right;" value="${l.amount===''?'':l.amount}" oninput="updateInvDocLine(${i},'amount',this.value)" placeholder="0" ${dis}></td>
      <td><input type="number" class="form-input" style="font-size:12px;padding:6px;text-align:right;" value="${l.tax_amount===''?'':l.tax_amount}" oninput="updateInvDocLine(${i},'tax_amount',this.value)" placeholder="0" ${dis}></td>
      <td><input class="form-input" style="font-size:12px;padding:6px;" value="${escapeHtml(l.memo||'')}" oninput="updateInvDocLine(${i},'memo',this.value)" placeholder="任意" ${dis}></td>
      ${ro?'':`<td><button class="btn btn-danger btn-sm" onclick="removeInvDocLine(${i})">削除</button></td>`}
    </tr>`).join('');
  if(_invDocLines.length===0)body.innerHTML=`<tr><td colspan="${ro?6:7}" style="color:var(--text3);text-align:center;padding:16px;">明細行がありません。${ro?'':'「＋ 行を追加」で追加してください。'}</td></tr>`;
  recalcInvDoc();
}

function updateInvDocLine(i,field,value){
  if(!_invDocLines[i])return;
  if(field==='project_id'){
    _invDocLines[i].project_id=value;
    const s=_sites.find(s=>s.id===value);
    _invDocLines[i].project_name=s?s.name:'';
  }else{
    _invDocLines[i][field]=value;
  }
  if(field==='amount')recalcInvDoc();
}
function addInvDocLine(){
  _invDocLines.push({project_id:'',project_name:'',cost_category:'',description:'',amount:'',tax_amount:'',memo:''});
  renderInvDocLinesTable();
}
function removeInvDocLine(i){
  _invDocLines.splice(i,1);
  renderInvDocLinesTable();
}

function recalcInvDoc(){
  const totalEl=document.getElementById('id-total');
  const total=totalEl&&totalEl.value!==''?parseInt(totalEl.value):null;
  const lineTotal=_invDocLines.reduce((s,l)=>s+(l.amount===''||l.amount==null?0:(parseInt(l.amount)||0)),0);
  const diff=total==null?null:(total-lineTotal);
  const tEl=document.getElementById('invDocSumTotal');
  const lEl=document.getElementById('invDocSumLines');
  const dEl=document.getElementById('invDocSumDiff');
  if(tEl)tEl.textContent=total==null?'(未入力)':fmt(total);
  if(lEl)lEl.textContent=fmt(lineTotal);
  if(dEl){dEl.textContent=diff==null?'-':fmt(diff);dEl.style.color=(diff===0)?'var(--green)':'var(--red)';}
  const okToConfirm=(diff===0&&_invDocLines.length>0);
  const cbtn=document.getElementById('invDocConfirmBtn');
  const hint=document.getElementById('invDocHint');
  if(cbtn){
    cbtn.disabled=!okToConfirm;
    cbtn.style.opacity=okToConfirm?'1':'0.5';
    cbtn.style.cursor=okToConfirm?'pointer':'not-allowed';
  }
  if(hint){
    if(_invDocLines.length===0)hint.textContent='※ 明細が1行もないため確認済みにできません';
    else if(total==null)hint.textContent='※ 請求書合計金額を入力してください';
    else if(diff!==0)hint.textContent='※ 差額が0円でないため確認済みにできません';
    else hint.textContent='✓ 差額0円・明細あり：確認済みにできます';
  }
}

function collectInvDocPayload(){
  return {
    vendor:document.getElementById('id-vendor').value.trim()||null,
    date:document.getElementById('id-date').value||null,
    month:document.getElementById('id-month').value||null,
    total:document.getElementById('id-total').value===''?null:parseInt(document.getElementById('id-total').value),
    tax:document.getElementById('id-tax').value===''?null:parseInt(document.getElementById('id-tax').value),
    memo:document.getElementById('id-memo').value||null,
    lines:_invDocLines.map((l,i)=>({
      line_no:i+1,
      project_id:l.project_id||null,
      project_name:l.project_name||null,
      cost_category:l.cost_category||null,
      description:l.description||null,
      amount:l.amount===''||l.amount==null?null:parseInt(l.amount),
      tax_amount:l.tax_amount===''||l.tax_amount==null?null:parseInt(l.tax_amount),
      tax_type:null,
      memo:l.memo||null
    }))
  };
}

async function saveInvDoc(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const p=collectInvDocPayload();
  const{error}=await sb.rpc('save_invoice_document_secure',{
    session_token_input:token,
    id_input:_invDocId,
    vendor_name_input:p.vendor,
    invoice_date_input:p.date,
    billing_month_input:p.month,
    total_amount_input:p.total,
    tax_amount_input:p.tax,
    memo_input:p.memo,
    lines_json:p.lines
  });
  if(error){alert('保存に失敗しました：'+error.message);return false;}
  return true;
}

async function confirmInvDoc(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  // 確認前に最新状態を保存
  const saved=await saveInvDoc();
  if(!saved)return;
  const{error}=await sb.rpc('confirm_invoice_document_secure',{
    session_token_input:token,id_input:_invDocId,confirmed_by_input:currentUser.name
  });
  if(error){alert('確認済みにできませんでした：'+error.message);return;}
  await openInvoiceDocDetail(_invDocId);
}

async function unconfirmInvDoc(){
  if(!confirm('確認を解除して編集可能な状態に戻しますか？\n（未登録の原価登録候補があれば削除されます）'))return;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const{error}=await sb.rpc('unconfirm_invoice_document_secure',{session_token_input:token,id_input:_invDocId});
  if(error){alert('確認解除に失敗しました：'+error.message);return;}
  await openInvoiceDocDetail(_invDocId);
}

async function createInvDocQueue(){

async function saveBudget(){const budgetId=_editBudgetId;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const site=document.getElementById('fb-site').value;
  const year=parseInt(document.getElementById('fb-year').value);
  const amountStr=document.getElementById('fb-amount').value;
  const amount=parseInt(amountStr);
  if(!site||!year||amountStr===''||isNaN(amount)){alert('現場・年度・金額は必須です');return;}
  const memo=document.getElementById('fb-memo').value||null;
  let error;
  if(budgetId){
    const res=await sb.rpc('update_site_budget_secure',{
      session_token_input:token,
      id_input:budgetId,
      site_id_input:site,
      year_input:year,
      amount_input:amount,
      memo_input:memo
    });
    error=res.error;
  }else{
    const res=await sb.rpc('upsert_site_budget_secure',{
      session_token_input:token,
      site_id_input:site,
      year_input:year,
      amount_input:amount,
      memo_input:memo
    }).maybeSingle();
    error=res.error;
  }
  if(error){alert('保存に失敗しました：'+error.message);return;}
  closeModal();await pageBudgets();
}

async function deleteBudget(id){
  if(!confirm('この実行予算を取り消しますか？'))return;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const{error}=await sb.rpc('deactivate_site_budget_secure',{session_token_input:token,id_input:id});
  if(error){alert('取り消しに失敗しました：'+error.message);return;}
  await pageBudgets();
}

async function restoreBudget(id){
  if(!confirm('この実行予算を取り消し済みから通常一覧に戻しますか？\n復元すると、原価管理の予算集計にも再度反映されます。'))return;
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const{error}=await sb.rpc('restore_site_budget_secure',{session_token_input:token,id_input:id});
  if(error){
    const msg=error.message?.includes('Duplicate active budget exists')
      ?'同じ現場・年度の有効な予算が既に存在します。先に現在の予算を取り消してください。'
      :'復元に失敗しました：'+error.message;
    alert(msg);return;
  }
  await pageBudgets();
}

          if(m.ownership==='lease'){

              else parts.push(dateStr);
            }
            if(m.lease_monthly) parts.push('¥'+Number(m.lease_monthly).toLocaleString()+'/月');
            leaseInfo=parts.join(' ｜ ')||'-';

          return `<tr>
            <td style="font-weight:500;">${escapeHtml(m.name)}</td>
            <td>${m.company_id?companyName(m.company_id):'<span style="color:var(--orange);">未設定</span>'}</td>

async function saveMachine(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}
  const machineId=_editMachineId;
  const name=document.getElementById('fm-name').value.trim();

  const ownership=isLease?'lease':'owned';
  const payload={
    name,
    company_id,
    is_active,
    ownership,
    lease_company:isLease?document.getElementById('fm-lease-company').value||null:null,
    lease_start:isLease?document.getElementById('fm-lease-start').value||null:null,
    lease_end:isLease?document.getElementById('fm-lease-end').value||null:null,
    lease_monthly:isLease?parseInt(document.getElementById('fm-lease-monthly').value)||null:null
  };
  let error;
  if(machineId){
    const res=await sb.rpc('update_machine_admin_secure',{
      session_token_input:token,
      machine_id_input:machineId,
      name_input:payload.name,
      company_id_input:payload.company_id,
      is_active_input:payload.is_active,
      ownership_input:payload.ownership,
      lease_company_input:payload.lease_company,
      lease_start_input:payload.lease_start,
      lease_end_input:payload.lease_end,
      lease_monthly_input:payload.lease_monthly
    });
    error=res.error;
  }else{
    const res=await sb.rpc('create_machine_admin_secure',{
      session_token_input:token,
      name_input:payload.name,
      company_id_input:payload.company_id,
      is_active_input:payload.is_active,
      ownership_input:payload.ownership,
      lease_company_input:payload.lease_company,
      lease_start_input:payload.lease_start,
      lease_end_input:payload.lease_end,
      lease_monthly_input:payload.lease_monthly
    });
    error=res.error;
  }
  if(error){alert('保存に失敗しました：'+error.message);return;}
  closeModal();await pageMachines();
}

let _leaveGrantEmpId=null;

async function pageLeave(){
  // 全員の付与・使用を RPC（list_paid_leave_admin_secure）で取得。管理者判定は token からサーバー側で行う。
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}

  const{data,error}=await sb.rpc('list_paid_leave_admin_secure',{session_token_input:token});
  if(error||!data){
    console.error('list_paid_leave_admin_secure error:',error);
    document.getElementById('pageContent').innerHTML='<div class="card"><div class="empty">有給情報の取得に失敗しました</div></div>';
    return;
  }
  const grants=data.grants||[];
  const approved=data.approved||[];
  const pending=data.pending||[];   // RPC が leave_date ASC で返す
  const workers=_employees.filter(e=>e.role!=='admin');

  function leaveTypeLabel(t){return t==='full'?'全日':t==='am'?'午前休':'午後休';}

  const empRows=workers.map(e=>{
    const granted=grants.filter(g=>g.employee_id===e.id).reduce((s,g)=>s+Number(g.granted),0);
    const used=approved.filter(r=>r.employee_id===e.id).reduce((s,r)=>s+(r.leave_type==='full'?1:0.5),0);
    const rem=granted-used;
    const remColor=rem<=2?'var(--orange)':'var(--green)';
    return `<tr>
      <td style="font-weight:500;">${escapeHtml(e.name)}</td>
      <td class="money">${granted}日</td>
      <td class="money">${used}日</td>
      <td class="money" style="color:${remColor};font-weight:600;">${rem}日</td>
      <td><button class="btn btn-secondary btn-sm" onclick="openLeaveGrantModal('${e.id}')">付与設定</button></td>
    </tr>`;
  }).join('');

  const pendingRows=pending.length===0
    ?'<tr><td colspan="5" class="empty">未処理の申請はありません</td></tr>'
    :pending.map(r=>{
      const emp=_employees.find(e=>e.id===r.employee_id);
      return `<tr>
        <td style="font-weight:500;">${escapeHtml(emp?.name||'不明')}</td>
        <td style="font-family:'DM Mono',monospace;">${escapeHtml(r.leave_date)}</td>
        <td>${leaveTypeLabel(r.leave_type)}</td>
        <td style="color:var(--text2);font-size:12px;">${escapeHtml(r.reason||'-')}</td>
        <td>
          <button class="btn btn-success btn-sm" onclick="reviewLeaveRequest('${r.id}','approved')">承認</button>
          <button class="btn btn-danger btn-sm" style="margin-left:4px;" onclick="reviewLeaveRequest('${r.id}','rejected')">却下</button>
        </td>
      </tr>`;
    }).join('');

  const html=`
    <div class="card">
      <div class="card-header"><div class="card-title">従業員別 有給状況</div></div>
      <table class="data-table">
        <thead><tr><th>従業員</th><th>付与日数</th><th>使用日数</th><th>残日数</th><th>操作</th></tr></thead>
        <tbody>${empRows||'<tr><td colspan="5" class="empty">従業員がいません</td></tr>'}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">未処理の有給申請</div></div>
      <table class="data-table">
        <thead><tr><th>従業員</th><th>取得日</th><th>種別</th><th>理由</th><th>操作</th></tr></thead>
        <tbody>${pendingRows}</tbody>
      </table>
    </div>`;
  document.getElementById('pageContent').innerHTML=html;
}

function renderNoticesPage(){
  const notices=_noticesCache;
  const isEditing=_editingNoticeId!==null;
  const editingNotice=isEditing?notices.find(n=>n.id===_editingNoticeId):null;

  const formTitle=isEditing?'📝 お知らせを編集':'➕ 新規お知らせ';
  const currentContent=editingNotice?escapeHtml(editingNotice.content):'';
  const currentActive=editingNotice?editingNotice.is_active:true;

  // Current attachment display in form
  let currentAttachmentHtml='<span style="color:var(--text3);font-size:12px;">添付なし</span>';
  if(isEditing&&editingNotice?.attachment_url){
    const url=escapeHtml(editingNotice.attachment_url);
    const name=escapeHtml(editingNotice.attachment_name||'添付ファイル');
    if(editingNotice.attachment_type==='image'){
      currentAttachmentHtml=`<div style="margin-bottom:6px;"><a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="添付画像" style="max-height:80px;max-width:200px;border-radius:4px;border:1px solid var(--border);display:block;"></a><button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="deleteNoticeAttachment('${editingNotice.id}')">添付を削除</button></div>`;
    }else if(editingNotice.attachment_type==='pdf'){
      currentAttachmentHtml=`<div style="margin-bottom:6px;"><div style="font-size:13px;margin-bottom:4px;">📄 <a href="${url}" target="_blank" rel="noopener">${name}</a></div><button class="btn btn-secondary btn-sm" onclick="deleteNoticeAttachment('${editingNotice.id}')">添付を削除</button></div>`;
    }
  }

  const rows=notices.length===0
    ?'<tr><td colspan="5" class="empty">お知らせはありません</td></tr>'
    :notices.map(n=>{
      const badge=n.is_active
        ?'<span style="color:var(--green);font-weight:600;">公開</span>'
        :'<span style="color:var(--text3);">非公開</span>';
      const d=new Date(n.created_at);
      const dateStr=d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0');
      const preview=escapeHtml(n.content.length>60?n.content.slice(0,60)+'…':n.content);
      const toggleLabel=n.is_active?'非公開にする':'公開にする';
      const rowStyle=_editingNoticeId===n.id?' style="background:var(--accent-light);"':'';
      let attachCell='-';
      if(n.attachment_url){
        const aUrl=escapeHtml(n.attachment_url);
        const aLabel=n.attachment_type==='pdf'?'PDF':'画像';
        attachCell=`<a href="${aUrl}" target="_blank" rel="noopener" style="font-size:12px;">${aLabel}</a>`;
      }
      return `<tr${rowStyle}>
        <td style="white-space:pre-wrap;word-break:break-all;">${preview}</td>
        <td style="text-align:center;">${badge}</td>
        <td style="text-align:center;">${attachCell}</td>
        <td style="font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;">${dateStr}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="editNotice('${n.id}')">編集</button>
          <button class="btn btn-secondary btn-sm" style="margin-left:4px;" onclick="toggleNoticeActive('${n.id}')">${toggleLabel}</button>
        </td>
      </tr>`;
    }).join('');

  const html=`
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div class="card-title">${formTitle}</div>
        ${isEditing?'<button class="btn btn-secondary btn-sm" onclick="resetNoticeForm()">新規作成に戻る</button>':''}
      </div>
      <div style="padding:16px;">
        <div class="form-group form-full" style="margin-bottom:12px;">
          <label class="form-label">お知らせ本文</label>
          <textarea class="form-input" id="notice-content" rows="4" placeholder="お知らせの内容を入力してください" style="resize:vertical;">${currentContent}</textarea>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">公開状態</label>
          <div style="display:flex;gap:16px;margin-top:6px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
              <input type="radio" name="notice-active" value="true" ${currentActive?'checked':''}> 公開
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
              <input type="radio" name="notice-active" value="false" ${!currentActive?'checked':''}> 非公開
            </label>
          </div>
        </div>
        <div class="form-group form-full" style="margin-bottom:16px;">
          <label class="form-label">添付ファイル（画像またはPDF・任意）</label>
          ${currentAttachmentHtml}
          <input type="file" id="notice-attachment" accept="image/jpeg,image/png,image/webp,application/pdf" style="display:block;margin-top:8px;font-size:13px;">
          <div style="font-size:11px;color:var(--text3);margin-top:4px;">画像 5MB / PDF 10MB まで。JPEG・PNG・WebP・PDF のみ可。</div>
        </div>
        <button class="btn btn-primary" onclick="saveNotice()">${isEditing?'更新する':'追加する'}</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">お知らせ一覧（${notices.length}件）</div></div>
      <table class="data-table">
        <thead><tr><th>本文</th><th style="text-align:center;">状態</th><th style="text-align:center;">添付</th><th>作成日</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  document.getElementById('pageContent').innerHTML=html;
}

async function saveNotice(){
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}

  const contentEl=document.getElementById('notice-content');
  const content=contentEl?contentEl.value.trim():'';
  if(!content){alert('お知らせ本文を入力してください');return;}

  const activeEl=document.querySelector('input[name="notice-active"]:checked');
  const isActive=activeEl?activeEl.value==='true':true;

  // File validation
  const fileInput=document.getElementById('notice-attachment');
  const file=fileInput?.files?.[0]||null;
  if(file){
    const allowed=['image/jpeg','image/png','image/webp','application/pdf'];
    if(!allowed.includes(file.type)){alert('画像（JPEG/PNG/WebP）またはPDFのみ添付できます');return;}
    const maxBytes=file.type==='application/pdf'?10*1024*1024:5*1024*1024;
    if(file.size>maxBytes){alert(file.type==='application/pdf'?'PDFは10MBまでです':'画像は5MBまでです');return;}
  }

  const btn=document.querySelector('#pageContent .btn-primary');
  if(btn)btn.disabled=true;

  let noticeId=_editingNoticeId;
  let error;

  if(_editingNoticeId){
    ({error}=await sb.rpc('update_notice_secure',{
      session_token_input:token,
      id_input:_editingNoticeId,
      content_input:content,
      is_active_input:isActive
    }));
  }else{
    let data;
    ({data,error}=await sb.rpc('create_notice_secure',{
      session_token_input:token,
      content_input:content,
      is_active_input:isActive
    }));
    if(!error&&data?.[0]?.id)noticeId=data[0].id;
  }

  if(error){if(btn)btn.disabled=false;alert('保存に失敗しました：'+error.message);return;}

  // Upload attachment if file selected
  if(file&&noticeId){
    const sanitized=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=`notices/${noticeId}/${Date.now()}_${sanitized}`;
    const{error:upErr}=await sb.storage.from('notice-attachments').upload(path,file,{contentType:file.type});
    if(upErr){if(btn)btn.disabled=false;alert('ファイルのアップロードに失敗しました：'+upErr.message);return;}
    const{data:urlData}=sb.storage.from('notice-attachments').getPublicUrl(path);
    const{error:attErr}=await sb.rpc('update_notice_attachment_secure',{
      session_token_input:token,
      id_input:noticeId,
      attachment_url_input:urlData.publicUrl,
      attachment_path_input:path,
      attachment_type_input:file.type==='application/pdf'?'pdf':'image',
      attachment_name_input:file.name
    });
    if(attErr){if(btn)btn.disabled=false;alert('添付情報の保存に失敗しました：'+attErr.message);return;}
  }

  if(btn)btn.disabled=false;
  _editingNoticeId=null;
  await loadNotices();
}

async function deleteNoticeAttachment(id){

// baseName: 'csv' が null のときは期間パートを付けない（重機台帳等）
// dateFrom/dateTo が両方 null かつ hasPeriod=true のとき「全期間」を付ける
function buildCsvFilename(baseName,dateFrom,dateTo,generatedAt,hasPeriod){
  const pad=n=>String(n).padStart(2,'0');
  const d=generatedAt?new Date(generatedAt):new Date();
  const ts=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  let periodPart='';
  if(hasPeriod){
    if(dateFrom&&dateTo)periodPart=`_${dateFrom}_${dateTo}`;
    else if(dateFrom)periodPart=`_${dateFrom}_`;
    else if(dateTo)periodPart=`__${dateTo}`;
    else periodPart='_全期間';
  }
  return`${baseName}${periodPart}_${ts}.csv`;
}

function escCsvValue(v){
  if(v===null||v===undefined)return'';
  const s=String(v);
  if(/[",\r\n]/.test(s))return'"'+s.replace(/"/g,'""')+'"';
  return s;
}

function downloadCsv(rpcResult,filenameBase,columns){
  const warnings=rpcResult?.warnings||[];
  const rows=rpcResult?.rows||[];
  if(warnings.length>0){
    alert(`警告が${warnings.length}件あります。CSVは出力します。必要に応じて内容を確認してください。`);
  }
  if(rows.length===0){
    alert('出力データは0件です。ヘッダ行のみのCSVを出力します。');
  }
  const header=columns.map(escCsvValue).join(',');
  const body=rows.map(r=>columns.map(k=>escCsvValue(r[k])).join(',')).join('\r\n');
  const csv=rows.length===0?(header+'\r\n'):(header+'\r\n'+body+'\r\n');
  const bom='\uFEFF';
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filenameBase;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ===== CSV一式ZIP出力（Phase 2-4-8-4） =====
// 年月のみの期間指定。個別CSV出力と同じRPC・同じ列定義を再利用し、4CSV＋manifest.jsonを1ZIPにまとめる。

// "2026-04" -> "2026-04-01"
function monthToStartDate(ym){return ym+'-01';}
// "2026-06" -> その月の末日 "2026-06-30"（date_to は既存RPCと同じ inclusive 比較を想定）
function monthToEndDate(ym){
  const p=ym.split('-');const y=Number(p[0]),m=Number(p[1]);
  const last=new Date(y,m,0).getDate();
  return`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
}
// 単月:「2026年6月分」/ 複数月:「2026年4月〜2026年6月分」
function formatPeriodLabel(fromM,toM){
  const f=fromM.split('-'),t=toM.split('-');
  const fl=`${Number(f[0])}年${Number(f[1])}月`;
  if(fromM===toM)return fl+'分';
  return`${fl}〜${Number(t[0])}年${Number(t[1])}月分`;
}
// ZIPファイル名用タイムスタンプ YYYYMMDD-HHMM
function formatZipTimestamp(d){
  const pad=n=>String(n).padStart(2,'0');
  return`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
// manifest 用の出力日時（JST相当・既存はローカル時刻運用）
function formatExportedAtJst(d){
  const pad=n=>String(n).padStart(2,'0');
  return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}+09:00`;
}
// 当月 "YYYY-MM"
function currentMonthStr(){
  const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
// CSV文字列を生成（downloadCsv と同じ整形・BOM付き。ZIP用にアラートは出さない）
function buildCsvText(rpcResult,columns){
  const rows=rpcResult?.rows||[];
  const header=columns.map(escCsvValue).join(',');
  const body=rows.map(r=>columns.map(k=>escCsvValue(r[k])).join(',')).join('\r\n');
  const csv=rows.length===0?(header+'\r\n'):(header+'\r\n'+body+'\r\n');
  return{csv:'﻿'+csv,rows:rows.length};
}

async function exportCsvZip(){
  const btn=document.getElementById('zipExportBtn');
  const fromM=(document.getElementById('zip-from')?.value)||'';
  const toM=(document.getElementById('zip-to')?.value)||'';
  // バリデーション
  if(!fromM){alert('開始年月を指定してください。');return;}
  if(!toM){alert('終了年月を指定してください。');return;}
  if(fromM>toM){alert('開始年月は終了年月以前を指定してください。');return;}
  if(typeof JSZip==='undefined'){alert('ZIPライブラリ(JSZip)が読み込めていません。ページを再読み込みして再度お試しください。改善しない場合は管理者に連絡してください。');return;}
  const token=currentUser?.session_token;
  if(!token){alert('セッションが無効です。再ログインしてください。');return;}

  const dateFrom=monthToStartDate(fromM);
  const dateTo=monthToEndDate(toM);
  const orig=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='ZIP作成中...';}
  try{
    // 既存と同じRPC・同じ列定義を再利用（machine_details は期間指定なし）
    const specs=[
      {type:'projects_summary',name:'projects_summary.csv',rpc:'export_projects_summary_secure',cols:CSV_COLUMNS.projects_summary,period:true},
      {type:'attendance_details',name:'attendance_details.csv',rpc:'export_attendance_details_secure',cols:CSV_COLUMNS.attendance_details,period:true},
      {type:'project_cost_details',name:'project_cost_details.csv',rpc:'export_project_cost_details_secure',cols:CSV_COLUMNS.project_cost_details,period:true},
      {type:'machine_details',name:'machine_details.csv',rpc:'export_machine_details_secure',cols:CSV_COLUMNS.machine_details,period:false},
      {type:'paid_leave_details',name:'paid_leave_details.csv',rpc:'export_paid_leave_details_secure',cols:CSV_COLUMNS.paid_leave_details,period:true},
      {type:'paid_leave_balances',name:'paid_leave_balances.csv',rpc:'export_paid_leave_balances_secure',cols:CSV_COLUMNS.paid_leave_balances,period:false}
    ];
    const zip=new JSZip();
    const files=[];
    for(const s of specs){
      const params=s.period
        ?{session_token_input:token,date_from_input:dateFrom,date_to_input:dateTo}
        :{session_token_input:token};
      const{data,error}=await sb.rpc(s.rpc,params);
      if(error)throw new Error(s.name+' の取得に失敗しました：'+error.message);
      const built=buildCsvText(data,s.cols);
      zip.file(s.name,built.csv);
      files.push({type:s.type,name:s.name,rows:built.rows});
    }
    const now=new Date();
    const manifest={
      format_version:'1.0',
      system:'okaigumi-internal-system',
      exported_at:formatExportedAtJst(now),
      period:{from_month:fromM,to_month:toM,granularity:'month',label:formatPeriodLabel(fromM,toM)},
      files:files
    };
    zip.file('manifest.json',JSON.stringify(manifest,null,2));

    const blob=await zip.generateAsync({type:'blob'});
    const zipName=`okaigumi-csv-export_${fromM.replace('-','')}-${toM.replace('-','')}_${formatZipTimestamp(now)}.zip`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=zipName;a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(err){
    alert('CSV一式ZIPの出力に失敗しました：'+(err&&err.message?err.message:String(err))+'\n時間をおいて再度お試しください。改善しない場合は管理者に連絡してください。');
  }finally{
    if(btn){btn.disabled=false;btn.textContent=orig||'⬇ CSV一式をZIPで出力';}
  }
}

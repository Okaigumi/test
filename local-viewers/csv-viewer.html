<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岡井組 CSVビューア</title>
<!--
  ローカルHTML CSVビューア（Phase 2-4-3：ページ切替型・白ベース業務帳票）
  - admin-app.html で出力したCSVをローカルで読み込んで確認する
  - Supabase接続なし / 外部ライブラリなし / 外部CDNなし / APIキーなし
  - file:// で動くオフラインビューア
  - 仕様：docs/local-viewer-spec.md
  - 集計ロジック（buildAttendanceReports 等）は二重計上防止を維持
-->
<style>
:root{
  --bg:#ffffff;--ink:#1a1d23;--muted:#5b6270;--faint:#8a909c;
  --line:#e1e4ea;--head:#f3f5f7;--accent:#1f3a8a;--accent-bg:#eaf0ff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);line-height:1.55;
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}

/* ===== ファイルパネル ===== */
.file-panel{border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.file-panel h1{font-size:17px;font-weight:700;}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
input[type=file]{font:inherit;font-size:13px;}
.file-name{font-size:12px;color:var(--muted);}
.preload{padding:40px 24px;color:var(--muted);font-size:14px;}

/* ===== レイアウト ===== */
.app{display:flex;align-items:flex-start;}
.viewer-nav{width:220px;flex-shrink:0;border-right:1px solid var(--line);
  padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.nav-title{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.05em;padding:4px 10px 12px;}
.nav-btn{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;font-size:13px;
  color:var(--muted);padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
.nav-btn:hover{background:var(--head);color:var(--ink);}
.nav-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:700;}
.main{flex:1;min-width:0;padding:22px 28px;max-width:1080px;}

/* ===== 帳票ヘッダ ===== */
.report-header{margin-bottom:14px;}
.report-header h1{font-size:20px;font-weight:700;margin-bottom:4px;}
.rh-meta{font-size:12px;color:var(--muted);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);}
.chip b{color:var(--ink);font-weight:700;}

/* ===== カード/汎用 ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px;box-shadow:none;}
.card-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;}
.note{font-size:12px;color:var(--muted);margin-top:8px;}
.hidden{display:none;}

/* ===== サマリーグリッド ===== */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.summary-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.summary-label{font-size:11px;color:var(--faint);}
.summary-val{font-size:16px;font-weight:600;margin-top:4px;word-break:break-all;font-variant-numeric:tabular-nums;}

/* ===== メッセージ ===== */
.msg{font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:6px;border:1px solid;}
.msg-warn{background:#fff8ee;color:#9a5b00;border-color:#f0d9b5;}
.msg-error{background:#fdecec;color:#a32020;border-color:#f0c2c2;}

/* ===== テーブル ===== */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{border-collapse:collapse;width:100%;font-size:12px;}
th{background:var(--head);color:var(--ink);text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap;word-break:break-word;max-width:340px;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
tr.total-row td{font-weight:700;background:#f7f8fa;border-top:2px solid #cfd4dc;}

/* ===== 出勤簿ブロック ===== */
.emp-block{margin-bottom:26px;}
.emp-head{font-size:15px;font-weight:700;margin-bottom:4px;}
.emp-meta{font-size:12px;color:var(--muted);margin-bottom:8px;}

/* ===== ボタン ===== */
.link-btn{border:none;background:none;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:0;}
.back-btn{border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;margin-bottom:14px;}
.back-btn:hover{background:var(--head);}

/* ===== 印刷 ===== */
@media print{
  @page{margin:12mm;}
  .no-print,.viewer-nav,.file-panel{display:none!important;}
  body{background:#fff;color:#000;}
  .app{display:block;}
  .main{max-width:none;padding:0;}
  .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  thead{display:table-header-group;}
  .emp-block{break-inside:avoid;}
  .viewer-page.hidden{display:none!important;}
  a,.link-btn{color:#000;text-decoration:none;}
  .table-scroll{overflow:visible;border:none;}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  tr.total-row td{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>

<!-- ファイルパネル（印刷時は非表示） -->
<div class="file-panel no-print">
  <h1>岡井組 CSVビューア</h1>
  <div class="file-row">
    <input type="file" id="fileInput" accept=".csv,text/csv">
    <span id="fileName" class="file-name"></span>
  </div>
</div>

<div id="preLoad" class="preload">CSVファイルを選択してください。admin画面から出力したCSVをローカルで確認できます（Supabaseには接続しません）。</div>

<div id="viewerBody" class="hidden">
  <div class="app">
    <!-- ナビ（印刷時は非表示） -->
    <aside class="viewer-nav no-print">
      <div class="nav-title">メニュー</div>
      <div id="viewerNavButtons"></div>
    </aside>

    <main class="main">
      <!-- 帳票ヘッダ（印刷時も残す） -->
      <div class="report-header" id="reportHeader"></div>
      <!-- 画面用チップ（印刷時は非表示） -->
      <div class="chips no-print" id="commonChips"></div>

      <section id="page-dashboard" class="viewer-page">
        <div class="card"><div class="card-title">ダッシュボード</div><div id="dashboardArea" class="summary-grid"></div></div>
      </section>

      <section id="page-monthly" class="viewer-page hidden">
        <div class="card"><div class="card-title">月別サマリー（出勤・労務）</div><div id="monthlyArea"></div></div>
      </section>

      <section id="page-employee" class="viewer-page hidden">
        <div class="card"><div class="card-title">従業員別サマリー（出勤・労務）</div><div class="note no-print" style="margin-top:0;margin-bottom:10px;">従業員名をクリックすると、その従業員の月別出勤簿を表示します。</div><div id="employeeArea"></div></div>
      </section>

      <section id="page-empMonthly" class="viewer-page hidden">
        <div class="card"><div class="card-title">従業員別 月別出勤簿</div><div id="empMonthlyArea"></div></div>
      </section>

      <section id="page-overall" class="viewer-page hidden">
        <div class="card"><div class="card-title">全体出勤簿</div><div id="overallArea"></div></div>
      </section>

      <section id="page-raw" class="viewer-page hidden">
        <div class="card"><div class="card-title">生データ</div><div id="rawNote" class="note"></div><div id="rawArea"></div></div>
      </section>

      <section id="page-messages" class="viewer-page hidden">
        <div class="card"><div class="card-title">警告・エラー</div><div id="messagesArea"></div></div>
      </section>
    </main>
  </div>
</div>

<script>
'use strict';

// ===== CSV種別レジストリ（必須列集合で判定） =====
const CSV_TYPES={
  attendance_details:{
    label:'出勤・労務明細',
    required:['report_id','report_date','employee_id','employee_name','normal_mins','overtime_mins','labor_days','labor_cost','report_status']
  },
  projects_summary:{
    label:'工事別サマリー',
    required:['project_id','site_name','fiscal_year','contract_amount','total_cost','gross_profit','profit_rate']
  },
  project_cost_details:{
    label:'請求書明細',
    required:['invoice_id','invoice_date','project_id','site_name','cost_category','vendor_name','amount','status']
  },
  machine_details:{
    label:'重機台帳',
    required:['machine_id','machine_name','ownership','lease_monthly','owned_cost','is_active']
  }
};

const MAX_DISPLAY_ROWS=300;

// ===== ページ定義 =====
// types に 'all' を含むページは全CSV種別で表示。専用ビュー追加時はここに足す。
const PAGE_DEFS=[
  {id:'dashboard',label:'ダッシュボード',types:['all']},
  {id:'monthly',label:'月別サマリー',types:['attendance_details']},
  {id:'employee',label:'従業員別サマリー',types:['attendance_details']},
  {id:'empMonthly',label:'従業員別 月別出勤簿',types:['attendance_details']},
  {id:'overall',label:'全体出勤簿',types:['attendance_details']},
  {id:'raw',label:'生データ',types:['all']},
  {id:'messages',label:'警告・エラー',types:['all']}
];

const VIEWER_PAGES=PAGE_DEFS.map(p=>p.id);

// CSV種別ごとの利用可能ページ
function getAvailablePageDefs(csvType){
  return PAGE_DEFS.filter(p=>p.types.includes('all')||p.types.includes(csvType));
}
function getAvailablePageIds(csvType){
  return getAvailablePageDefs(csvType).map(p=>p.id);
}

// 読み込み状態
let state={loaded:false,fileName:'',csvType:null,csvLabel:'',headers:[],rows:[],
  reports:null,warnings:[],errors:[],minDate:'',maxDate:'',generatedAt:''};

// ===== CSVパーサ（自前・文字単位ステートマシン） =====
// 返り値：array of arrays（行 × セル）。クォート未閉じは例外。
function parseCsvToMatrix(text){
  // 先頭BOM除去
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const out=[];
  let record=[];
  let field='';
  let inQuotes=false;
  const n=text.length;
  let i=0;
  const endField=()=>{record.push(field);field='';};
  const endRecord=()=>{endField();out.push(record);record=[];};
  while(i<n){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i+=2;continue;}
        inQuotes=false;i++;continue;
      }
      field+=c;i++;continue;
    }
    if(c==='"'){inQuotes=true;i++;continue;}
    if(c===','){endField();i++;continue;}
    if(c==='\r'){
      if(text[i+1]==='\n')i++;
      endRecord();i++;continue;
    }
    if(c==='\n'){endRecord();i++;continue;}
    field+=c;i++;
  }
  if(inQuotes){const e=new Error('クォートが閉じていません。');e.code='UNCLOSED_QUOTE';throw e;}
  // 末尾に未確定の field / record があれば1件確定（末尾改行ありの空行は作らない）
  if(field!==''||record.length>0)endRecord();
  // 完全な空行（全セル空文字）は除外
  return out.filter(r=>!(r.length===1&&r[0]===''));
}

// ===== CSV種別判定（必須列集合・列順非依存） =====
function detectCsvType(headers){
  const hset=new Set(headers);
  const matches=[];
  for(const key of Object.keys(CSV_TYPES)){
    const def=CSV_TYPES[key];
    if(def.required.every(col=>hset.has(col))){
      matches.push({key,label:def.label,score:def.required.length});
    }
  }
  if(matches.length===0)return{key:null,multiple:false,matches:[]};
  matches.sort((a,b)=>b.score-a.score);
  return{key:matches[0].key,label:matches[0].label,multiple:matches.length>1,matches};
}

// ===== 数値・表示ヘルパー =====
function toNumber(v){
  if(v===null||v===undefined||v==='')return 0;
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}
function formatMinutes(mins){
  const m=Math.round(toNumber(mins));
  const sign=m<0?'-':'';
  const a=Math.abs(m);
  return sign+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
}
function formatMoney(v){
  return Math.round(toNumber(v)).toLocaleString('ja-JP');
}
function formatNumber(v,digits){
  const d=(digits===undefined)?2:digits;
  const fixed=toNumber(v).toFixed(d);
  // 小数部だけ末尾0を除去（整数部は触らない：10.00→10, 1.50→1.5, 0.30→0.3）
  if(!fixed.includes('.'))return fixed;
  const parts=fixed.split('.');
  const frac=parts[1].replace(/0+$/,'');
  return frac?parts[0]+'.'+frac:parts[0];
}
function formatReportStatus(status){
  const map={pending:'提出済み',confirmed:'確認済み',approved:'承認済み',rejected:'差戻し'};
  return map[status]||status||'';
}
function formatMonthLabel(ym){
  const m=/^(\d{4})-(\d{2})$/.exec(ym);
  if(!m)return ym;
  return m[1]+'年'+String(Number(m[2]))+'月';
}
function nowStamp(){
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

// ===== DOMヘルパー（textContentのみ・innerHTML不使用） =====
function clear(el){el.replaceChildren();}
function noteEl(text){const d=document.createElement('div');d.className='note';d.textContent=text;return d;}
function addMsg(area,cls,text){
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;area.appendChild(d);
}
function addSummary(area,label,val){
  const item=document.createElement('div');item.className='summary-item';
  const l=document.createElement('div');l.className='summary-label';l.textContent=label;
  const v=document.createElement('div');v.className='summary-val';v.textContent=val;
  item.appendChild(l);item.appendChild(v);area.appendChild(item);
}

// ===== attendance_details: report_id ピボット（Layer 2 reports 生成） =====
// normal_mins / overtime_mins は日報全体値のため1行目を採用しSUMしない。
// labor_days / labor_cost は按分後値のため report_id 内でSUMする。
function buildAttendanceReports(rows){
  const warnings=[];
  const map=new Map();
  const sharedNum=['normal_mins','overtime_mins'];
  const sharedStr=['report_date','employee_id','employee_name','start_time','end_time','work_type','report_status'];
  const mismatchSeen=new Set();
  rows.forEach(r=>{
    const rid=(r['report_id']!==undefined)?r['report_id']:'';
    let rep=map.get(rid);
    if(!rep){
      rep={
        report_id:rid,
        report_date:r['report_date']||'',
        employee_id:r['employee_id']||'',
        employee_name:r['employee_name']||'',
        work_type:r['work_type']||'',
        start_time:r['start_time']||'',
        end_time:r['end_time']||'',
        normal_mins:toNumber(r['normal_mins']),
        overtime_mins:toNumber(r['overtime_mins']),
        report_status:r['report_status']||'',
        memo:r['memo']||'',
        site_names:[],
        row_count:0,
        labor_days_total:0,
        labor_cost_total:0
      };
      map.set(rid,rep);
    }else{
      // 共有属性の不一致検知（1行目の値を採用・処理は止めない）
      sharedStr.forEach(f=>{
        const cur=(r[f]!==undefined)?r[f]:'';
        if(String(rep[f])!==String(cur)){
          const key=rid+'|'+f;
          if(!mismatchSeen.has(key)){
            mismatchSeen.add(key);
            warnings.push('report_id='+rid+' の '+f+' が行によって異なります。1行目の値を採用します。');
          }
        }
      });
      sharedNum.forEach(f=>{
        if(rep[f]!==toNumber(r[f])){
          const key=rid+'|'+f;
          if(!mismatchSeen.has(key)){
            mismatchSeen.add(key);
            warnings.push('report_id='+rid+' の '+f+' が行によって異なります。1行目の値を採用します。');
          }
        }
      });
    }
    // site_name 集約（空は「(現場なし)」）
    let sn=r['site_name'];
    if(sn===undefined||sn==='')sn='(現場なし)';
    if(rep.site_names.indexOf(sn)===-1)rep.site_names.push(sn);
    // 按分後値はSUM
    rep.row_count+=1;
    rep.labor_days_total+=toNumber(r['labor_days']);
    rep.labor_cost_total+=toNumber(r['labor_cost']);
  });
  return{reports:Array.from(map.values()),warnings};
}

// ===== 月別サマリー（reports から集計） =====
function buildMonthlyAttendanceSummary(reports){
  const map=new Map();
  reports.forEach(rep=>{
    const ym=(rep.report_date&&rep.report_date.length>=7)?rep.report_date.slice(0,7):'(不明)';
    let a=map.get(ym);
    if(!a){a={month:ym,empSet:new Set(),daySet:new Set(),reportSet:new Set(),normal_mins:0,overtime_mins:0,labor_days:0,labor_cost:0};map.set(ym,a);}
    if(rep.employee_id)a.empSet.add(rep.employee_id);
    a.daySet.add(rep.employee_id+'|'+rep.report_date);
    a.reportSet.add(rep.report_id);
    a.normal_mins+=rep.normal_mins;
    a.overtime_mins+=rep.overtime_mins;
    a.labor_days+=rep.labor_days_total;
    a.labor_cost+=rep.labor_cost_total;
  });
  const arr=Array.from(map.values()).map(a=>({
    month:a.month,employees:a.empSet.size,work_days:a.daySet.size,report_count:a.reportSet.size,
    normal_mins:a.normal_mins,overtime_mins:a.overtime_mins,labor_days:a.labor_days,labor_cost:a.labor_cost
  }));
  arr.sort((x,y)=>x.month<y.month?-1:(x.month>y.month?1:0));
  return arr;
}

// ===== 従業員別サマリー（reports から集計） =====
function buildEmployeeAttendanceSummary(reports){
  const map=new Map();
  reports.forEach(rep=>{
    const key=rep.employee_id||('name:'+rep.employee_name);
    let a=map.get(key);
    if(!a){a={employee_id:rep.employee_id,employee_name:rep.employee_name,daySet:new Set(),reportSet:new Set(),normal_mins:0,overtime_mins:0,labor_days:0,labor_cost:0};map.set(key,a);}
    a.daySet.add(rep.report_date);
    a.reportSet.add(rep.report_id);
    a.normal_mins+=rep.normal_mins;
    a.overtime_mins+=rep.overtime_mins;
    a.labor_days+=rep.labor_days_total;
    a.labor_cost+=rep.labor_cost_total;
  });
  const arr=Array.from(map.values()).map(a=>({
    employee_id:a.employee_id,employee_name:a.employee_name,work_days:a.daySet.size,report_count:a.reportSet.size,
    normal_mins:a.normal_mins,overtime_mins:a.overtime_mins,labor_days:a.labor_days,labor_cost:a.labor_cost
  }));
  arr.sort((x,y)=>x.employee_name<y.employee_name?-1:(x.employee_name>y.employee_name?1:0));
  return arr;
}

// ===== 出勤簿 日別ブロック生成（overall / empMonthly 共通） =====
// reports（Layer2）のみ使用。normal_mins/overtime_mins は report単位値。
const DAILY_COLS=[
  {label:'日付',cls:'',fmt:r=>r.report_date},
  {label:'現場名',cls:'',fmt:r=>r.site_names.join('・')},
  {label:'開始',cls:'',fmt:r=>r.start_time},
  {label:'終了',cls:'',fmt:r=>r.end_time},
  {label:'通常',cls:'num',fmt:r=>formatMinutes(r.normal_mins)},
  {label:'残業',cls:'num',fmt:r=>formatMinutes(r.overtime_mins)},
  {label:'人工',cls:'num',fmt:r=>formatNumber(r.labor_days_total,2)},
  {label:'労務費',cls:'num',fmt:r=>formatMoney(r.labor_cost_total)},
  {label:'状態',cls:'',fmt:r=>formatReportStatus(r.report_status)},
  {label:'メモ',cls:'',fmt:r=>r.memo}
];

function buildAttendanceBlock(headingText,reportList){
  // 並び：report_date 昇順 → start_time 昇順 → report_id 昇順
  const list=reportList.slice().sort((a,b)=>{
    if(a.report_date!==b.report_date)return a.report_date<b.report_date?-1:1;
    if(a.start_time!==b.start_time)return a.start_time<b.start_time?-1:1;
    return a.report_id<b.report_id?-1:(a.report_id>b.report_id?1:0);
  });
  const dateSet=new Set(),reportSet=new Set();
  let sN=0,sO=0,sD=0,sC=0;
  list.forEach(r=>{dateSet.add(r.report_date);reportSet.add(r.report_id);sN+=r.normal_mins;sO+=r.overtime_mins;sD+=r.labor_days_total;sC+=r.labor_cost_total;});

  const block=document.createElement('div');block.className='emp-block';
  const head=document.createElement('div');head.className='emp-head';head.textContent=headingText;block.appendChild(head);
  const meta=document.createElement('div');meta.className='emp-meta';
  meta.textContent='出勤日数：'+dateSet.size+'日　稼働件数：'+reportSet.size+'件　通常時間：'+formatMinutes(sN)+'　残業時間：'+formatMinutes(sO)+'　人工：'+formatNumber(sD,2)+'　労務費：'+formatMoney(sC)+'円';
  block.appendChild(meta);

  const scroll=document.createElement('div');scroll.className='table-scroll';
  const table=document.createElement('table');
  const thead=document.createElement('thead');const trh=document.createElement('tr');
  DAILY_COLS.forEach(c=>{const th=document.createElement('th');th.textContent=c.label;if(c.cls)th.className=c.cls;trh.appendChild(th);});
  thead.appendChild(trh);table.appendChild(thead);
  const tbody=document.createElement('tbody');
  list.forEach(r=>{const tr=document.createElement('tr');DAILY_COLS.forEach(c=>{const td=document.createElement('td');td.textContent=c.fmt(r);if(c.cls)td.className=c.cls;tr.appendChild(td);});tbody.appendChild(tr);});

  // 合計行（通常・残業・人工・労務費）
  const totals={'通常':formatMinutes(sN),'残業':formatMinutes(sO),'人工':formatNumber(sD,2),'労務費':formatMoney(sC)};
  const trt=document.createElement('tr');trt.className='total-row';
  DAILY_COLS.forEach((c,idx)=>{const td=document.createElement('td');if(idx===0)td.textContent='合計';else if(totals[c.label]!==undefined)td.textContent=totals[c.label];else td.textContent='';if(c.cls)td.className=c.cls;trt.appendChild(td);});
  tbody.appendChild(trt);

  table.appendChild(tbody);scroll.appendChild(table);block.appendChild(scroll);
  return block;
}

// ===== サマリーテーブル描画（textContent・列ごとにnumクラス対応） =====
function renderSummaryTable(container,columns,dataArr){
  clear(container);
  const scroll=document.createElement('div');scroll.className='table-scroll';
  const table=document.createElement('table');
  const thead=document.createElement('thead');const trh=document.createElement('tr');
  columns.forEach(c=>{const th=document.createElement('th');th.textContent=c.label;if(c.cls)th.className=c.cls;trh.appendChild(th);});
  thead.appendChild(trh);table.appendChild(thead);
  const tbody=document.createElement('tbody');
  if(dataArr.length===0){
    const tr=document.createElement('tr');const td=document.createElement('td');
    td.colSpan=columns.length;td.textContent='データ0件です。';tr.appendChild(td);tbody.appendChild(tr);
  }else{
    dataArr.forEach(row=>{
      const tr=document.createElement('tr');
      columns.forEach(c=>{
        const td=document.createElement('td');
        if(c.cls)td.className=c.cls;
        if(c.render)c.render(td,row);
        else td.textContent=c.fmt?c.fmt(row[c.key],row):String(row[c.key]);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  table.appendChild(tbody);scroll.appendChild(table);container.appendChild(scroll);
}

// ===== ナビ描画（CSV種別に応じて動的生成・textContent） =====
function renderViewerNav(csvType){
  const area=document.getElementById('viewerNavButtons');
  clear(area);
  const defs=getAvailablePageDefs(csvType);
  defs.forEach(def=>{
    const btn=document.createElement('button');
    btn.className='nav-btn';
    btn.dataset.page=def.id;
    btn.textContent=def.label;
    btn.addEventListener('click',()=>showViewerPage(def.id));
    area.appendChild(btn);
  });
}

// ===== ページ切替（許可されていないページはダッシュボードへ） =====
function showViewerPage(pageName){
  const available=getAvailablePageIds(state.csvType);
  const target=available.includes(pageName)?pageName:'dashboard';
  VIEWER_PAGES.forEach(p=>{
    const sec=document.getElementById('page-'+p);
    if(sec)sec.classList.toggle('hidden',p!==target);
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===target));
}

// ===== 従業員名クリック → 従業員別 月別出勤簿 =====
function showEmployeeMonthlyAttendance(employeeId){
  renderEmployeeMonthlyAttendance(employeeId);
  showViewerPage('empMonthly');
}

function renderEmployeeMonthlyAttendance(employeeId){
  const area=document.getElementById('empMonthlyArea');
  clear(area);
  const back=document.createElement('button');
  back.className='back-btn no-print';
  back.textContent='← 従業員別サマリーに戻る';
  back.addEventListener('click',()=>showViewerPage('employee'));
  area.appendChild(back);

  const reps=(state.reports||[]).filter(r=>r.employee_id===employeeId);
  if(reps.length===0){area.appendChild(noteEl('対象の従業員データがありません。'));return;}

  const empName=reps[0].employee_name||'(名前なし)';
  const title=document.createElement('div');
  title.className='emp-head';title.style.fontSize='17px';title.style.marginBottom='12px';
  title.textContent=empName+' 出勤簿';
  area.appendChild(title);

  // 月ごとにグループ化（report_date.slice(0,7)）
  const monthMap=new Map();
  reps.forEach(r=>{
    const ym=(r.report_date&&r.report_date.length>=7)?r.report_date.slice(0,7):'(不明)';
    if(!monthMap.has(ym))monthMap.set(ym,[]);
    monthMap.get(ym).push(r);
  });
  const months=Array.from(monthMap.keys()).sort((a,b)=>a<b?-1:(a>b?1:0));
  months.forEach(ym=>{
    area.appendChild(buildAttendanceBlock(formatMonthLabel(ym),monthMap.get(ym)));
  });
}

function renderCommonChips(){

  const period=(state.minDate||state.maxDate)?(state.minDate+' 〜 '+state.maxDate):'—';

    ['ファイル名',state.fileName],
    ['CSV種別',state.csvLabel||'—'],

function renderDashboard(){
  const area=document.getElementById('dashboardArea');clear(area);
  const period=(state.minDate||state.maxDate)?(state.minDate+' 〜 '+state.maxDate):'—';
  addSummary(area,'CSV種別',state.csvLabel||'—');
  addSummary(area,'データ行数',String(state.rows.length));
  if(state.csvType==='attendance_details'&&state.reports){
    const reps=state.reports;
    const empSet=new Set();let sN=0,sO=0,sD=0,sC=0;
    reps.forEach(r=>{if(r.employee_id)empSet.add(r.employee_id);sN+=r.normal_mins;sO+=r.overtime_mins;sD+=r.labor_days_total;sC+=r.labor_cost_total;});

    addSummary(area,'通常時間合計',formatMinutes(sN));
    addSummary(area,'残業時間合計',formatMinutes(sO));
    addSummary(area,'人工合計',formatNumber(sD,2));
    addSummary(area,'労務費合計',formatMoney(sC)+' 円');
  }
  addSummary(area,'警告件数',String(state.warnings.length));
  addSummary(area,'エラー件数',String(state.errors.length));
}

function renderOverallPage(){
  const area=document.getElementById('overallArea');clear(area);
  if(state.csvType!=='attendance_details'||!state.reports){area.appendChild(noteEl('このCSVでは出勤簿未対応です（出勤・労務明細CSVで利用できます）。'));return;}
  if(state.reports.length===0){area.appendChild(noteEl('データ0件です。'));return;}
  // 従業員ごとにグループ化（従業員名昇順）
  const groups=new Map();
  state.reports.forEach(rep=>{
    const key=rep.employee_id||('name:'+rep.employee_name);
    let g=groups.get(key);
    if(!g){g={employee_name:rep.employee_name,reports:[]};groups.set(key,g);}
    g.reports.push(rep);
  });
  const groupArr=Array.from(groups.values()).sort((a,b)=>a.employee_name<b.employee_name?-1:(a.employee_name>b.employee_name?1:0));
  groupArr.forEach(g=>{area.appendChild(buildAttendanceBlock(g.employee_name||'(名前なし)',g.reports));});
}

function renderEmpMonthlyDefault(){
  const area=document.getElementById('empMonthlyArea');clear(area);
  if(state.csvType!=='attendance_details'){area.appendChild(noteEl('このCSVでは出勤簿未対応です（出勤・労務明細CSVで利用できます）。'));return;}
  area.appendChild(noteEl('「従業員別サマリー」で従業員名をクリックすると、その従業員の月別出勤簿を表示します。'));

function renderRawPage(){
  const note=document.getElementById('rawNote');
  const area=document.getElementById('rawArea');clear(area);
  const rows=state.rows,headers=state.headers;
  if(rows.length===0){note.textContent='データ0件です。';}
  else if(rows.length>MAX_DISPLAY_ROWS){note.textContent='全'+rows.length+'件のうち先頭'+MAX_DISPLAY_ROWS+'行のみ表示しています。';}
  else{note.textContent='全'+rows.length+'件を表示しています。';}
  const scroll=document.createElement('div');scroll.className='table-scroll';
  const table=document.createElement('table');
  const thead=document.createElement('thead');const trh=document.createElement('tr');
  headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;trh.appendChild(th);});
  thead.appendChild(trh);table.appendChild(thead);
  const tbody=document.createElement('tbody');
  const limit=Math.min(rows.length,MAX_DISPLAY_ROWS);
  for(let i=0;i<limit;i++){
    const tr=document.createElement('tr');
    headers.forEach(h=>{const td=document.createElement('td');td.textContent=rows[i][h]!==undefined?rows[i][h]:'';tr.appendChild(td);});

function renderMessagesPage(){
  const area=document.getElementById('messagesArea');clear(area);
  if(state.errors.length===0&&state.warnings.length===0){

  if(state.errors.length>0){

// ===== メイン処理 =====
function handleText(fileName,text){
  // 状態初期化
  state={loaded:true,fileName:fileName,csvType:null,csvLabel:'',headers:[],rows:[],
    reports:null,warnings:[],errors:[],minDate:'',maxDate:'',generatedAt:nowStamp()};
  document.getElementById('preLoad').classList.add('hidden');
  document.getElementById('viewerBody').classList.remove('hidden');

  // 文字化け検知
  if(text.indexOf('�')!==-1){
    state.warnings.push('文字化けの可能性があります。Excelで保存し直したShift_JIS CSVではなく、admin画面から出力したUTF-8 CSVを読み込んでください。');
  }

  // パース
  let matrix;
  try{
    matrix=parseCsvToMatrix(text);
  }catch(err){
    state.errors.push(err.code==='UNCLOSED_QUOTE'?'クォートが閉じていません。':('CSVの解析に失敗しました：'+err.message));
    renderAllPages();showViewerPage('messages');return;
  }
  if(matrix.length===0){
    state.errors.push('CSVが空です。ヘッダ行がありません。');
    renderAllPages();showViewerPage('messages');return;
  }

  // ヘッダ（トリムしてBOM残り対策）
  const headers=matrix[0].map(h=>h.trim());
  if(headers.length===0||headers.every(h=>h==='')){
    state.errors.push('ヘッダ行がありません。');
    renderAllPages();showViewerPage('messages');return;
  }
  state.headers=headers;

  // CSV種別判定
  const detected=detectCsvType(headers);
  if(detected.key===null){
    state.errors.push('未知のCSV形式です。admin画面から出力したCSVを選択してください。');
    renderAllPages();showViewerPage('messages');return;
  }
  if(detected.multiple){
    const labels=detected.matches.map(m=>m.label).join(' / ');
    state.warnings.push('複数のCSV種別に一致しました（'+labels+'）。必須列数が最も多い「'+detected.label+'」として扱います。');
  }
  state.csvType=detected.key;
  state.csvLabel=detected.label;

  // データ行 → オブジェクト配列
  const dataMatrix=matrix.slice(1);
  let colCountMismatch=0;let hasExtra=false;
  const rows=dataMatrix.map(cells=>{
    const obj={};
    headers.forEach((h,idx)=>{obj[h]=idx<cells.length?cells[idx]:'';});
    if(cells.length<headers.length)colCountMismatch++;
    if(cells.length>headers.length){
      colCountMismatch++;hasExtra=true;
      for(let k=headers.length;k<cells.length;k++)obj['__extra_'+(k-headers.length+1)]=cells[k];
    }
    return obj;
  });
  state.rows=rows;
  if(colCountMismatch>0){
    state.warnings.push('データ行の列数がヘッダ列数と一致しない行が'+colCountMismatch+'件あります。不足列は空文字として扱います。'+(hasExtra?'超過列は __extra_N として保持しています。':''));
  }

  // attendance_details：report_id ピボット
  if(state.csvType==='attendance_details'){
    const built=buildAttendanceReports(rows);
    state.reports=built.reports;
    built.warnings.forEach(w=>state.warnings.push(w));
    // 対象期間（report_date）
    const dates=rows.map(r=>r['report_date']).filter(v=>v&&v!=='');
    if(dates.length){
      state.minDate=dates.reduce((a,b)=>a<b?a:b);
      state.maxDate=dates.reduce((a,b)=>a>b?a:b);
    }
  }else{
    // 他CSV：日付列があれば対象期間を推定（任意）
    const dateKey=state.csvType==='project_cost_details'?'invoice_date':null;
    if(dateKey){
      const dates=rows.map(r=>r[dateKey]).filter(v=>v&&v!=='');
      if(dates.length){state.minDate=dates.reduce((a,b)=>a<b?a:b);state.maxDate=dates.reduce((a,b)=>a>b?a:b);}
    }
  }

  renderAllPages();
  showViewerPage('dashboard');
}

// ===== ファイル選択 =====
document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files&&e.target.files[0];
  document.getElementById('fileName').textContent=file?file.name:'';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){handleText(file.name,String(reader.result));};
  reader.onerror=function(){
    state={loaded:true,fileName:file.name,csvType:null,csvLabel:'',headers:[],rows:[],
      reports:null,warnings:[],errors:['ファイルが読めません。'],minDate:'',maxDate:'',generatedAt:nowStamp()};
    document.getElementById('preLoad').classList.add('hidden');
    document.getElementById('viewerBody').classList.remove('hidden');
    renderAllPages();showViewerPage('messages');
  };
  reader.readAsText(file,'UTF-8');
});
